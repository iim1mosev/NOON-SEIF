*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Cairo',system-ui,sans-serif;background:var(--bg);color:var(--tx);transition:background .3s,color .3s;min-height:100vh;display:flex;flex-direction:column;align-items:center}
.top{width:100%;max-width:520px;display:flex;justify-content:space-between;gap:8px;padding:12px 16px 0}
.pill{border:2.5px solid var(--bd);background:var(--cd);color:var(--tx);font:700 14px Cairo;padding:6px 14px;border-radius:999px;cursor:pointer}

header{display:flex;justify-content:center;padding:6px 16px}

main{width:100%;max-width:520px;padding:10px 16px 26px;flex:1}
.tabs{display:grid;grid-template-columns:1fr 1fr 1.1fr;background:var(--k);border-radius:20px;padding:5px;gap:5px;margin-bottom:16px}

.pv{text-align:center}

#qr canvas,#qr img{width:200px!important;height:200px!important}
.code{direction:ltr;font:900 22px/1.2 Cairo,monospace;margin-top:12px;word-break:break-all}
.lbl{font-weight:700;font-size:14px;margin:12px 2px 8px;display:block}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2.5px solid var(--bd);background:var(--cd);color:var(--tx);transition:transform .12s,background .2s;font:700 15px Cairo;padding:7px 14px;border-radius:999px;cursor:pointer;min-width:46px;text-align:center}
.chip.n{padding:7px 0;width:48px}

.btn{width:100%;border:0;cursor:pointer;font:700 16px Cairo;padding:13px;border-radius:16px;margin-top:10px}

#reader{border-radius:18px;overflow:hidden;background:#000;min-height:240px}

footer a{text-decoration:none}footer a:hover b{text-decoration:underline}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes bump{50%{transform:scale(1.06)}}
@keyframes logo{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:none}}
section{animation:pop .3s ease}

.ico{flex:0 0 46px;border:0;border-radius:14px;background:var(--r);box-shadow:0 3px 0 var(--rd);font-size:20px;cursor:pointer}
.ico:active{transform:translateY(3px)}
.rt{margin-inline-start:auto;display:flex;gap:8px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#ppv{width:100%;border-radius:16px;margin-top:12px}
.cr{display:flex;align-items:center;gap:10px;margin-top:10px}
.cr span{flex:1;font-weight:700;direction:ltr;text-align:start}
.cb{width:44px;height:44px;border-radius:14px;border:0;font:900 22px Cairo;background:var(--r);color:#fff;box-shadow:0 3px 0 var(--rd);cursor:pointer}
.cb.m{background:var(--cd);color:var(--r);border:2.5px solid var(--r);box-shadow:none}
.cb:active{transform:scale(.9)}
.cn{width:44px;text-align:center;font:900 24px Cairo}
a.btn{display:block;text-align:center;text-decoration:none}
</style>

<script>
const T={
 ar:{w:'أهلاً بعودتك : _iim_mosev',t1:'QR الأماكن',t2:'Product Code',zone:'القسم',aisle:'الممر',cab:'الدولاب',row:'الصف',col:'العمود',pal:'رقم البالتة',
  enter:'اكتب الكود (من 8 إلى 13 رقم)',scan:'افتح الكاميرا واسكان',img:'اسكان من صورة',bad:'الكود لازم يكون من 8 إلى 13 رقم',aim:'وجّه الكاميرا ناحية الباركود',
  close:'إغلاق',copy:'نسخ',done:'تم النسخ ✓',clr:'مسح',none:'مفيش كود من 8 إلى 13 رقم في الصورة، جرّب تاني',cerr:'مش قادر أفتح الكاميرا. اسمح بالوصول للكاميرا من إعدادات المتصفح.',inst:'⬇ تثبيت كبرنامج',lang:'English',flash:'🔦 فلاش',t3:'تصوير ➜ 👥',snap:'📷 صوّر',retake:'📷 صوّر تاني',rst:'مسح الكل',grp:'فتح الجروب',nophoto:'صوّر الصورة الأول',shared:'اختار الجروب من القايمة وابعت',desk:'الصورة والرسالة اتنسخوا. الصقهم (Ctrl+V) في الجروب',fno:'الفلاش مش مدعوم على الجهاز ده'},
 en:{w:'Welcome back : _iim_mosev',t1:'Location QR',t2:'Product Code',zone:'Section',aisle:'Aisle',cab:'Cabinet',row:'Row',col:'Column',pal:'Pallet No.',
  enter:'Enter code (8 to 13 digits)',scan:'Open camera & scan',img:'Scan from image',bad:'Code must be 8 to 13 digits',aim:'Point the camera at the barcode',
  close:'Close',copy:'Copy',done:'Copied ✓',clr:'Clear',none:'No 8–13 digit code found, try again',cerr:'Cannot open the camera. Allow camera access in browser settings.',inst:'⬇ Install app',lang:'عربي',flash:'🔦 Flash',t3:'Photo ➜ 👥',snap:'📷 Take photo',retake:'📷 Retake',rst:'Reset',grp:'Open group',nophoto:'Take a photo first',shared:'Pick the group from the list and send',desk:'Photo and message copied. Paste (Ctrl+V) in the group',fno:'Flash is not supported on this device'}
};
const ZN={main:['الرئيسي','Main'],bskt:['الباسكيت','Basket'],pro:['برومو','Promo'],chr:['التلاجة','Chiller'],frzr:['الفريزر','Freezer'],pallet:['البالتات','Pallets'],hv:['هاي فاليو','High Value']};
const P='DS16',pad=n=>String(n).padStart(2,'0');
const Z={
 main:{aisle:12,cab:15,rows:7,f:s=>`${P}-${pad(s.a)}-${pad(s.c)}-${pad(s.r)}${s.l}`},
 bskt:{cab:5,rows:7,f:s=>`${P}-BSKT${pad(s.c)}-${pad(s.r)}${s.l}`},
 pro:{cab:3,rows:7,f:s=>`${P}-PRO-${pad(s.c)}-${pad(s.r)}${s.l}`},
 chr:{cab:25,rows:7,f:s=>`${P}-CHR-${pad(s.c)}-${pad(s.r)}${s.l}`},
 frzr:{cab:25,rows:7,f:s=>`${P}-FRZR-${pad(s.c)}-${pad(s.r)}${s.l}`},
 pallet:{cab:5,pal:1,f:s=>`${P}-PALLET-${pad(s.c)}`},
 hv:{cab:6,rows:7,f:s=>`${P}-HV-${pad(s.c)}-${pad(s.r)}${s.l}`}
};
const $=id=>document.getElementById(id);
let lang=localStorage.getItem('nm_lang')||'ar',zone='main',s={a:1,c:1,r:1,l:'A'};
const t=k=>T[lang][k];

function group(label,key,items,cls){
 return `<span class="lbl">${label}</span><div class="chips">${items.map(v=>`<button class="chip ${cls} ${String(s[key])===String(v)?'on':''}" data-k="${key}" data-v="${v}">${key==='l'?v:(key==='z'?v[1]:pad(v))}</button>`).join('')}</div>`;
}
function build(){
 const z=Z[zone],rng=n=>Array.from({length:n},(_,i)=>i+1);
 const zs=Object.keys(Z).map(k=>`<button class="chip ${k===zone?'on':''}" data-k="z" data-v="${k}">${ZN[k][lang==='ar'?0:1]}</button>`).join('');
 let h=`<span class="lbl">${t('zone')}</span><div class="chips">${zs}</div>`;
 if(z.aisle)h+=group(t('aisle'),'a',rng(z.aisle),'n');
 h+=group(z.pal?t('pal'):t('cab'),'c',rng(z.cab),'n');
 if(z.rows){h+=group(t('row'),'r',rng(z.rows),'n');h+=group(t('col'),'l',['A','B','C'],'n')}
 $('sel').innerHTML=h;
 $('sel').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  const k=b.dataset.k,v=b.dataset.v;
  if(k==='z'){zone=v;s.a=Math.min(s.a,Z[v].aisle||1);s.c=Math.min(s.c,Z[v].cab)}
  else s[k]=k==='l'?v:+v;
  build();render();
 });
}
let cur='';
function draw(c){
 cur=c;$('codeTxt').textContent=c;$('qr').innerHTML='';
 new QRCode($('qr'),{text:c,width:400,height:400,correctLevel:QRCode.CorrectLevel.M});
 $('qr').classList.remove('bump');void $('qr').offsetWidth;$('qr').classList.add('bump');
}
function render(){const c=Z[zone].f(s);$('qin').value=c;draw(c)}
const norm=v=>{v=v.trim().toUpperCase().replace(/\s+/g,'');return !v?'':v.startsWith('DS16')?v:'DS16-'+v.replace(/^-+/,'')};
function ok(z,v){const d=Z[z];if(v.c<1||v.c>d.cab||(v.a&&v.a>d.aisle)||(v.r&&v.r>(d.rows||0)))return null;return{zone:z,s:v}}
function parse(c){let m;
 if(m=c.match(/^DS16-(\d{2})-(\d{2})-(\d{2})([A-C])$/))return ok('main',{a:+m[1],c:+m[2],r:+m[3],l:m[4]});
 if(m=c.match(/^DS16-BSKT(\d{2})-(\d{2})([A-C])$/))return ok('bskt',{c:+m[1],r:+m[2],l:m[3]});
 if(m=c.match(/^DS16-(PRO|CHR|FRZR|HV)-(\d{2})-(\d{2})([A-C])$/))return ok(m[1].toLowerCase(),{c:+m[2],r:+m[3],l:m[4]});
 if(m=c.match(/^DS16-PALLET-(\d{2})$/))return ok('pallet',{c:+m[1]});
 return null}
function setQR(raw){const c=norm(raw);if(!c)return;$('qin').value=c;const p=parse(c);if(p){zone=p.zone;s={...s,...p.s};build()}draw(c)}
$('qin').oninput=e=>{const c=norm(e.target.value);if(c)draw(c)};
$('qin').onchange=e=>setQR(e.target.value);
function feedback(){
 try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=1000;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start();setTimeout(()=>{o.stop();a.close()},130)}catch(e){}
 if(navigator.vibrate)navigator.vibrate(150);
}
let dark=localStorage.getItem('nm_dark')==='1';
function applyTheme(){document.body.classList.toggle('dark',dark);$('theme').textContent=dark?'☀️':'🌙';document.querySelector('meta[name=theme-color]').content=dark?'#141414':'#F5E000'}
$('theme').onclick=()=>{dark=!dark;localStorage.setItem('nm_dark',dark?'1':'0');applyTheme()};
function texts(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 $('wtxt').textContent=t('w');$('t1').textContent=t('t1');$('t2').textContent=t('t2');
 $('penter').textContent=t('enter');$('scan').textContent=t('scan');$('scanimg').textContent=t('img');
 $('cclose').textContent=t('close');$('pcp').textContent=t('copy');$('pclr').textContent=t('clr');
 $('inst').textContent=t('inst');$('flash').textContent=t('flash');$('t3').textContent=t('t3');$('snap').textContent=photo?t('retake'):t('snap');$('grst').textContent=t('rst');$('glink').textContent=t('grp');$('lang').textContent=t('lang');$('cmsg').textContent=t('aim');
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));
 $('sq').classList.toggle('hide',b.dataset.t!=='q');$('sp').classList.toggle('hide',b.dataset.t!=='p');$('sg').classList.toggle('hide',b.dataset.t!=='g');
});

 $('pc').value=c;$('pbig').textContent=c;$('res').classList.remove('hide');$('pmsg').textContent='';
 const f=c.length===13?'EAN13':c.length===8?'EAN8':'CODE128';

 catch(e){try{JsBarcode('#bc',c,{format:'CODE128',height:70,displayValue:false,margin:4})}catch(_){}}

async function closeCam(){$('cam').classList.remove('on');torch=false;if(sc){try{await sc.stop();sc.clear()}catch(e){}sc=null}}

async function openCam(mode){
 $('cam').classList.add('on');$('cmsg').textContent=t('aim');
 try{
  sc=new Html5Qrcode('reader',{experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});

}
function gmsg(){const n=k=>cn[k]||0;
 return `Store Code: ${STORE}\nMissing SKU Count : ${n('sku')}\n`+(n('exc')?`Excess Items: ${n('exc')}\n`:'')+`Missing Items: ${n('mis')}\nDamage item: ${n('dmg')}\nWrong item: ${n('wr')}\nTote Missing: ${n('tote')}`}
$('snap').onclick=()=>$('pf').click();
$('pf').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();
 im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);pcv=c;
  c.toBlob(b=>{photo=new File([b],'noon-'+Date.now()+'.jpg',{type:'image/jpeg'});$('ppv').src=URL.createObjectURL(b);$('ppv').classList.remove('hide');$('snap').textContent=t('retake')},'image/jpeg',.85)};
 im.src=URL.createObjectURL(f);e.target.value=''};
$('grst').onclick=()=>{cn={};photo=null;pcv=null;$('ppv').classList.add('hide');$('snap').textContent=t('snap');$('gmsg').textContent='';drawCnt()};
$('gok').onclick=async()=>{
 if(!photo){$('gmsg').textContent=t('nophoto');return}
 const text=gmsg();
 try{await navigator.clipboard.writeText(text)}catch(e){}
 if(navigator.canShare&&navigator.canShare({files:[photo]})){
  try{await navigator.share({files:[photo],text});$('gmsg').textContent=t('shared');return}catch(e){if(e.name==='AbortError')return}
 }
 try{await navigator.clipboard.write([new ClipboardItem({'image/png':new Promise(r=>pcv.toBlob(r,'image/png')),'text/plain':new Blob([text],{type:'text/plain'})})])}catch(e){}
 window.open(GROUP,'_blank');$('gmsg').textContent=t('desk');
};
drawCnt();
applyTheme();texts();build();render();
const w=$('welcome'),hideW=()=>{w.classList.add('out');setTimeout(()=>w.remove(),600)};
w.onclick=hideW;setTimeout(hideW,1400);
</script>
</body>
