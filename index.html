:#F5E000;--r:#D91E1E;--rh:#B91818;--k:#1C1917;--bg:#FAFAF9;--cd:#fff;--tx:#1C1917;--mut:#78716C;--line:#E7E5E4;--soft:#F5F5F4;--rad:12px;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
body.dark{--bg:#0C0A09;--cd:#171514;--tx:#FAFAF9;--mut:#A8A29E;--line:#2A2625;--soft:#201D1C}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter','IBM Plex Sans Arabic',system-ui,sans-serif;font-size:15px;line-height:1.5;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;transition:background .2s,color .2s}
button,input,a{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:2px solid var(--r);outline-offset:2px}
.hide{display:none!important}
.tab[data-t=q]::before,.tab[data-t=p]::before,.tab[data-t=g]::before,.tab[data-t=c]::before,.tab[data-t=t]::before,#theme::before,#lang::before,#inst::before,#flash::before,#tswap::before,#snap::before,#scan::before,#scanimg::before,#qcam::before,#pcp::before,#pclr::before,#grst::before,#glink::before,#cclose::before,#gok::before{content:"";flex:none;width:18px;height:18px;background:currentColor;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.tab[data-t=q]{--m:var(--i-qr)}.tab[data-t=p]{--m:var(--i-bar)}.tab[data-t=g]{--m:var(--i-cam)}.tab[data-t=c]{--m:var(--i-tag)}.tab[data-t=t]{--m:var(--i-box)}#theme{--m:var(--i-moon)}body.dark #theme{--m:var(--i-sun)}#lang{--m:var(--i-globe)}#inst{--m:var(--i-dl)}#flash{--m:var(--i-bolt)}#tswap{--m:var(--i-swap)}#snap{--m:var(--i-cam)}#scan{--m:var(--i-cam)}#scanimg{--m:var(--i-img)}#qcam{--m:var(--i-cam)}#pcp{--m:var(--i-copy)}#pclr{--m:var(--i-x)}#grst{--m:var(--i-rst)}#glink{--m:var(--i-ext)}#cclose{--m:var(--i-x)}#gok{--m:var(--i-ok)}
.bar{position:sticky;top:0;z-index:5;background:var(--y);border-bottom:1px solid rgba(0,0,0,.1)}
body.dark .bar{background:var(--cd);border-color:var(--line)}
.bar-in{max-width:960px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:16px;color:#1C1917;text-decoration:none}
body.dark .brand{color:var(--tx)}
.brand img{border-radius:8px}
.acts{display:flex;gap:8px;align-items:center}
.pill{height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border-radius:8px;border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.6);font-size:13px;font-weight:500;color:#1C1917;transition:background .15s}
.pill:hover{background:#fff}
body.dark .pill{background:var(--soft);border-color:var(--line);color:var(--tx)}
body.dark .pill:hover{background:var(--line)}
.pill.inst{background:var(--r);border-color:var(--r);color:#fff}
.pill.ib{width:36px;padding:0;justify-content:center}
main{width:100%;max-width:960px;margin:0 auto;padding:20px 16px 32px;flex:1}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line);margin-bottom:20px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;color:var(--mut);font-size:14px;font-weight:500;white-space:nowrap;transition:color .15s,border-color .15s}
.tab:hover{color:var(--tx)}
.tab.on{color:var(--tx);border-bottom-color:var(--r)}
section{max-width:560px;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.card{background:var(--cd);border:1px solid var(--line);border-radius:var(--rad);padding:20px;margin-bottom:16px}
.pv{text-align:center}
.qrbox,.bcbox{display:inline-block;padding:12px;background:#fff;border:1px solid var(--line);border-radius:10px;line-height:0;max-width:100%}
.qrbox.bump{animation:fade .2s}
#qr canvas,#qr img,#pqr canvas,#pqr img{width:min(220px,64vw)!important;height:min(220px,64vw)!important}
.bcbox svg{max-width:100%;height:auto}
.code{font-family:var(--mono);font-weight:600;font-size:18px;margin-top:14px;direction:ltr;word-break:break-all;letter-spacing:.02em}
.cnt{margin-top:6px;font-size:13px;color:var(--mut)}
.lbl{display:block;font-size:13px;font-weight:500;color:var(--mut);margin:18px 0 8px}
.lbl:first-child{margin-top:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:36px;min-width:36px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--cd);font-size:14px;font-weight:500;transition:background .12s,border-color .12s}
.chip.n{width:44px;padding:0}
.chip:hover{border-color:var(--mut)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--cd)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:44px;margin-top:12px;padding:0 16px;border-radius:8px;border:1px solid transparent;font-size:15px;font-weight:500;text-decoration:none;transition:background .15s,transform .1s}
.btn:active{transform:scale(.985)}
.btn:first-child{margin-top:0}
.red{background:var(--r);color:#fff}.red:hover{background:var(--rh)}
.wht{background:var(--cd);border-color:var(--line);color:var(--tx)}.wht:hover{background:var(--soft)}
.blk{background:var(--tx);color:var(--cd)}.blk:hover{opacity:.9}
.two{display:flex;gap:8px}.two .btn{margin-top:12px}
input[type=text],input[type=password]{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:8px;background:var(--cd);color:var(--tx);outline:none;direction:ltr;font-size:16px;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--r);box-shadow:0 0 0 3px rgba(217,30,30,.15)}
::placeholder{color:var(--mut);opacity:.7}
#pc{text-align:center;font-family:var(--mono);font-size:20px;letter-spacing:.08em}
.qrin{display:flex;gap:8px;margin-bottom:16px}
.qrin input{font-family:var(--mono);font-size:15px}
.ico{flex:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;border:1px solid var(--line);background:var(--cd);transition:background .15s}
.ico:hover{background:var(--soft)}
.msg{min-height:20px;margin-top:10px;font-size:13px;font-weight:500;color:var(--r);text-align:center}
#res{text-align:center}
#res .big{direction:ltr;font-family:var(--mono);font-weight:600;font-size:22px;letter-spacing:.06em;word-break:break-all;margin-bottom:12px}
#bc{max-width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px}
.pl{display:flex;flex-direction:column;gap:6px}
.pi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--cd);text-align:start;font-size:14px;font-weight:500;transition:background .12s,border-color .12s}
.pi small{direction:ltr;font-family:var(--mono);font-size:12.5px;color:var(--mut);font-weight:400}
.pi:hover{background:var(--soft)}
.pi.on{border-color:var(--tx);background:var(--soft)}
.cr{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.cr span{flex:1;font-size:14px;font-weight:500;direction:ltr;text-align:start}
.cb{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--cd);font-size:18px;line-height:1;transition:background .12s}
.cb:hover{background:var(--soft)}
.cn{min-width:32px;text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
#cnt{margin-bottom:4px}
#ppv{width:100%;border-radius:10px;margin-top:12px;border:1px solid var(--line)}
#cam{position:fixed;inset:0;background:rgba(12,10,9,.7);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
#cam.on{display:flex;animation:fade .15s}
.cbox{background:var(--cd);border:1px solid var(--line);border-radius:var(--rad);padding:16px;width:100%;max-width:440px}
#reader{border-radius:8px;overflow:hidden;background:#000;min-height:240px}
#welcome{position:fixed;inset:0;z-index:40;background:var(--y);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .6s ease;cursor:pointer;animation:fade .3s}
#welcome img{width:84px;height:84px;border-radius:20px}
#welcome h1{font-size:18px;font-weight:600;color:#1C1917;direction:ltr;text-align:center}
#welcome.out{opacity:0;pointer-events:none}
footer{width:100%;padding:20px 16px;text-align:center;font-size:13px;color:var(--mut);border-top:1px solid var(--line);direction:ltr}
footer a{color:var(--tx);text-decoration:none;font-weight:500}footer a:hover{text-decoration:underline}
footer b{font-weight:600}
@media(min-width:860px){#sq,#sc{max-width:none;display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}#sq .card,#sc .card{margin:0}#sq>.card:first-child,#sc>.card:first-child{position:sticky;top:76px}}
@media(max-width:480px){main{padding:16px 12px 24px}.card{padding:16px}.pill:not(.ib){padding:0 10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="welcome"><img src="icon-192.png" alt=""><h1 id="wtxt"></h1></div>

<div class="bar"><div class="bar-in">
 <a class="brand" href="./"><img src="icon-192.png" alt="" width="32" height="32"><span>Noon Minutes</span></a>
 <div class="acts"><button class="pill inst hide" id="inst"></button><button class="pill" id="lang"></button><button class="pill ib" id="theme" aria-label="Toggle theme"></button></div>
</div></div>
<main>
 <div class="tabs" role="tablist">
  <button role="tab" class="tab on" data-t="q" id="t1"></button>
  <button role="tab" class="tab" data-t="p" id="t2"></button>
  <button role="tab" class="tab" data-t="g" id="t3"></button>
  <button role="tab" class="tab" data-t="c" id="t4"></button>
  <button role="tab" class="tab" data-t="t" id="t5"></button>
 </div>

 <section id="sq">
  <div class="card pv">
   <div class="qrin"><input type="text" id="qin" placeholder="DS16-CHR-02-03A" autocapitalize="characters" autocomplete="off"><button class="ico" id="qcam" aria-label="Scan with camera"></button></div>
   <div id="qr" class="qrbox"></div>
   <div class="code" id="codeTxt"></div>
  </div>
  <div class="card" id="sel"></div>
 </section>

 <section id="sp" class="hide">
  <div class="card">
   <span class="lbl" id="penter"></span>
   <input type="text" id="pc" inputmode="numeric" maxlength="13" placeholder="0000000000000">
   <button class="btn red" id="scan"></button>
   <button class="btn wht" id="scanimg"></button>
   <input type="file" id="file" accept="image/*" class="hide">
   <div class="msg" id="pmsg" aria-live="polite"></div>
  </div>
  <div class="card hide" id="res">
   <div class="big" id="pbig"></div>
   <svg id="bc"></svg>
   <div class="two"><button class="btn blk" id="pcp"></button><button class="btn wht" id="pclr"></button></div>
  </div>
 </section>
<section id="sc" class="hide">
  <div class="card pv"><div id="pqr" class="qrbox"></div><div class="code" id="plab" style="font-size:16px;margin-top:10px"></div><div class="code" id="pcode"></div></div>
  <div class="card"><div class="pl" id="plist"></div></div>
 </section>
 <section id="st" class="hide">
  <div class="card pv"><div class="bcbox"><svg id="tbc"></svg></div><div class="code" id="tcode"></div><div class="cnt" id="tcnt"></div>
   <button class="btn red" id="tswap"></button></div>
 </section>
 <section id="sg" class="hide">
  <div class="card">
   <button class="btn red" id="snap" style="margin-top:0"></button>
   <input type="file" id="pf" accept="image/*" capture="environment" class="hide">
   <img id="ppv" class="hide" alt="">
   <div id="cnt"></div>
   <button class="btn blk" id="gok">OK</button>
